; Per-game opencomposite.ini for Superhot VR (appid 617830).
; The presence of this file makes oc-launch use it instead of the global one.

[default]
supersampleRatio = 1.0
haptics = true

; DIAGNOSTIC: log every OpenVR call to find out whether the game uses the
; modern IVRInput action API (bindings_oculus_touch.json honored) or the
; legacy GetControllerState API (bindings file ignored, hardcoded mapping).
; Keep this ON only while debugging - log files reach hundreds of MB.
logAllOpenVRCalls = true
