; Per-game OpenComposite override. Optional.
;
; Only present if this game needs different render/haptics tunables than the
; global file in gaming/vr/opencomposite/global/opencomposite.ini.
;
; Remember: the binding REMAP for controllers does NOT happen here. It is done
; by overriding the bindings_*.json files dropped next to this opencomposite.ini.

[default]
; supersampleRatio = 1.2
; haptics = true
