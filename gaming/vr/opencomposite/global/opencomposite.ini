; OpenComposite global tunables.
; Deployed by oc-launch when a per-game directory exists but does not ship its
; own opencomposite.ini. Lives in the game cwd so the OpenComposite vrclient.so
; can find it via getcwd() + "/opencomposite.ini" (Linux only behavior).
;
; Valid options for the installed build (znixian/OpenOVR rev cff07db7):
;   admitUnknownProps, enableHiddenMeshFix, handColour, haptics,
;   hiddenMeshVerticalScale, initUsingVulkan, invertUsingShaders,
;   logAllOpenVRCalls, logGetTrackedProperty, renderCustomHands,
;   stopOnSoftAbort, supersampleRatio
;
; Anything else (e.g. forceProfile, enableAppRequestedBindings) is NOT
; supported by this build and will abort the game at launch with a popup.

[default]
; Modest supersample. Quest 1/2/3 already handle this from the runtime side,
; so keep it conservative to avoid double scaling with WiVRn.
supersampleRatio = 1.0

; Helps with some games that use grip pull as analog (Quest Touch behavior).
haptics = true

; Quiet, set to true if a game logs nothing useful and we need to debug.
logAllOpenVRCalls = false
